[nlp]
lang = "en"
pipeline = ["llm"]

[components]

[components.llm]
factory = "llm"

[components.llm.task]
@llm_tasks = "spacy.NER.v3"
labels = ['PERSON', 'ORGANIZATION', 'ADDRESS', 'POSITION', 'OCCUPATION', 'TELEPHONE', 'MILITARY BRANCH']

[components.llm.task.label_definitions]
PERSON = first and last name of a person and may include titles such as Mr., Mrs., or Jr. or a leading quotation "
ORGANIZATION = name of an organization or business and can include a leading quotation "
ADDRESS = street address as well as any state, city, zip or other location information. May include a prefix h or r, e.g., h123 Main St, r123 Main St or 123 Main St
POSITION = a job position, which can be abbreviated, e.g., President, emp, stdt, rtd, ofc sec, etc.
OCCUPATION = type of job held by the person, usually the industry or field of work
TELEPHONE = a phone number with no areacode, e.g., 123-4567 or 1234567.
MILITARY BRANCH = abbreviated branch of the military, if any. e.g., USA, USMC, USN, USCG, USAF

[components.llm.task.examples]
@misc = "spacy.FewShotReader.v1"
path = /Users/collinzoeller/PycharmProjects/ZincoML/parsing/examples.yaml

[components.llm.model]
@llm_models = "spacy.PaLM.v1"
name = "chat-bison-001"
config = {"temperature":0.0}

